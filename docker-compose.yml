services:
  ulpf-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: ulpf:0.1.0
    container_name: ulpf-engine
    ports:
      - "5140:5140/udp"
      - "5140:5140/tcp"
    # Mount the whole data dir (not the ledger file directly): if the host
    # file is missing, Docker would create a directory at its path instead.
    # Host dir must be writable by UID 1000 (see Dockerfile note).
    volumes:
      - ./data:/opt/ulpf/data
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    # Strictly air-gapped configuration: no outbound internet required
    networks:
      - ulpf-net

networks:
  ulpf-net:
    driver: bridge
